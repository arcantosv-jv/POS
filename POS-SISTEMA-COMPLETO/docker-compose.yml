version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pos_db
    environment:
      POSTGRES_USER: ${DB_USER:-pos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pos_secure_password_123}
      POSTGRES_DB: ${DB_NAME:-pos_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pos_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: pos_app
    command: >
      bash -c "flask db upgrade && gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 app:app"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-pos_user}:${DB_PASSWORD:-pos_secure_password_123}@db:5432/${DB_NAME:-pos_db}
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
