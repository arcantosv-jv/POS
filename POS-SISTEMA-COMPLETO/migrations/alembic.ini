# Alembic configuration file

# Identificador de esta sección en el arquivo INI
[alembic]
# ruta a las migraciones
sqlalchemy.url = ${SQLALCHEMY_DATABASE_URI}
target_metadata = db.metadata

# Logging
[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
